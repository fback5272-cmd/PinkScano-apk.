name: Build PinkScan Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: |
          if [ -d "${ANDROID_HOME}/cmdline-tools/latest/bin" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for direct download
        run: cp app/build/outputs/apk/debug/app-debug.apk PinkScan-debug.apk

      - name: Upload PinkScan Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinkScan-debug-apk
          path: PinkScan-debug.apk
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: PinkScan Latest Debug APK
          body: Automated debug APK build from PinkScan (`com.aistudio.pinkscan.xrtkvw`).
          files: PinkScan-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
